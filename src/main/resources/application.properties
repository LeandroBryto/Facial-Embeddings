spring.application.name=memory

spring.jpa.hibernate.ddl-auto=update
spring.main.headless=${SPRING_MAIN_HEADLESS:false}

memoryguard.crypto.master-key-base64=${MEMORYGUARD_CRYPTO_MASTER_KEY_BASE64:}
memoryguard.admin.key=${MEMORYGUARD_ADMIN_KEY:}

memoryguard.session.token-minutes=${MEMORYGUARD_SESSION_TOKEN_MINUTES:5}
memoryguard.session.timeout-minutes=${MEMORYGUARD_SESSION_TIMEOUT_MINUTES:5}
memoryguard.session.expire-delay-ms=${MEMORYGUARD_SESSION_EXPIRE_DELAY_MS:60000}
